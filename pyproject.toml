[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-search"
version = "2.0.7"
description = "Agent-friendly CLI for Grok, Tavily, and Firecrawl web search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx[socks]>=0.28.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
search = "grok_search.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
